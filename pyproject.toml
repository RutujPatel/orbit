[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-orbit"
version = "0.1.0"
description = "Deterministic acceptance engine for the Shadow ORBIT experiment."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]
